<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="fact(5)">Click Here</button>
    <script>
        function fact(n){
            let i=n;
            let factorial=1;
            while(i>0){
                factorial=factorial*i;
                i--;
            }
            alert(factorial);
        }
    </script>
</body>
</html>
