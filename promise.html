        let pizzapromise=new Promise((resolve,reject)=>{

            reject("pizza is not ready")
        })
        pizzapromise.then((r)=>{

        pizzapromise.catch((r)=>{
            console.log(r)
        })

        let s=new Promise((resolve,reject)=>{
            resolve("you are selected")
            reject("you are not selected")
        })
        s.then((res)=>{
            console.log(res)
        })
        s.catch(function(res){
            console.log(res)
        })

        let ques=new Promise((resolve,reject)=>{

        })

        })

        })

        let a=new Promise((resolve,reject)=>{ 
            resolve("you are in top 3")
            reject("you are not in top 3")
        })
        a.then((r)=>{           //r is just a parameter given by user
            console.log(r)
        })
        a.catch((r)=>{

        })
        a.finally(()=>{

        })
